# The image ships an empty /etc/machine-id, so systemd never treats a boot as the
# first one and the stock ConditionFirstBoot=yes would never fire. The build
# removes the host keys instead; their absence is what triggers generation, so
# every board gets its own keys on its first start.
[Unit]
ConditionFirstBoot=
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
