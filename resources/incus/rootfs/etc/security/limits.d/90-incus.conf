# Production limits for an Incus host (arm-packer, PROFILE=incus), from
# https://linuxcontainers.org/incus/docs/main/reference/server_settings/
# memlock matters to BPF syscall supervision; the Incus service sets its own.
*	soft	nofile	1048576
*	hard	nofile	1048576
root	soft	nofile	1048576
root	hard	nofile	1048576
*	soft	memlock	unlimited
*	hard	memlock	unlimited
root	soft	memlock	unlimited
root	hard	memlock	unlimited
