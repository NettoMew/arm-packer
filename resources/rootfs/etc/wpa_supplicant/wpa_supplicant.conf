# Wi-Fi credentials. Add your network below, or append a block with the
# PSK already hashed: wpa_passphrase "SSID" "password" >> this file
# Then bring wlan0 up the way the image's network configuration describes.
# The control socket is root's only: no group is shared by every distro
# (Debian has no "wheel"), and wpa_supplicant refuses to start on a
# group that does not exist.
ctrl_interface=/var/run/wpa_supplicant
update_config=1
country=US

