# Out-of-the-box Wi-Fi template for Widora MangoPi M28K (AIC8800).
# Fill in your network below (or run: wpa_passphrase "SSID" "password" >> this file)
# then reboot, or: rc-service wpa_supplicant restart && udhcpc -i wlan0
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1
country=US

