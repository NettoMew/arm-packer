# Hinlink H88K (RK3588), pure DTB + Armbian-proven boot chain.
#
# The critical difference vs this builder's old combined mainline u-boot-rockchip.bin
# is the boot chain, not userspace/LCD.  Armbian hinlink-h88k.csc uses the Radxa
# U-Boot next-dev-v2024.10 / rock-5b defconfig (DT patched to rk3588-evb + console
# on) in the "spl-blobs" scenario: rkbin DDR blob + freshly built SPL packed into
# idbloader.img (sector 64), and u-boot.itb (BL31 + u-boot proper, sector 16384).
#
# Blob versions are pinned to the ONE image proven to boot this board (the running
# hybrid at root@100.64.0.164 reports androidboot.fwver=ddr-v1.18-9fa84341ce,
# bl31-v1.48,uboot-rmbian-2024.10).  The v1.18 DDR blob embeds the exact string
# "ddr-v1.18-9fa84341ce" — do NOT bump to v1.20 (b8ce94f14b), which is unverified
# on H88K.  Runtime surface stays pure (one mainline H88K DTB, no LCD/v2/v3/SATA).
BOARD_VENDOR="rockchip"
BOARD_SOC="rk3588"
BOARD_UBOOT_DEFCONFIG="rock-5b-rk3588_defconfig"
UBOOT_REPO="${UBOOT_REPO:-https://github.com/radxa/u-boot.git}"
UBOOT_REF="${UBOOT_REF:-next-dev-v2024.10}"
RKBIN_REPO="${RKBIN_REPO:-https://github.com/armbian/rkbin.git}"
RKBIN_REF="${RKBIN_REF:-6ead9fdef01d3874bc4d6159dd7ff1759e6daa76}"
RK3588_BL31="${RK3588_BL31:-rk35/rk3588_bl31_v1.48.elf}"
RK3588_TPL="${RK3588_TPL:-rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.18.bin}"
ROCKCHIP_SPL_BLOBS="${ROCKCHIP_SPL_BLOBS:-1}"
UBOOT_CLEAN_MODE="${UBOOT_CLEAN_MODE:-none}"
BOARD_KERNEL_DTB="rockchip/rk3588-hinlink-h88k.dtb"
BOARD_HOSTNAME="hinlink-h88k"
BOARD_MENU_TITLE="Hinlink H88K"
BOARD_SERIAL_CONSOLE="ttyS2"
BOARD_SERIAL_BAUD="1500000"

# Armbian's booted mainline image exposes GMAC + two RTL8125 NICs on H88K.
BOARD_NICS="3"

# Full firmware is useful for Wi-Fi/BT, but the front LCD overlay/firmware is not
# part of this pure baseline because it is non-essential for boot.
FULL_FIRMWARE="${FULL_FIRMWARE:-1}"
H88K_LCD="${H88K_LCD:-0}"
BOARD_IMAGE_PREFIX="hinlink-h88k"
