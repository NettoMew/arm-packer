# Hinlink H88K (RK3588). Octa-core RK3588, on-board GMAC gigabit (RGMII PHY) +
# 2x RTL8125 2.5G on PCIe → three wired NICs, all brought up by DHCP (no WAN/LAN
# split). HS400 eMMC, TF, SDIO Wi-Fi slot, ES8388 audio, HDMI out/in + DP, and a
# 240x135 SPI LCD (panel-mipi-dbi-spi). Mali-G610 → Panthor (rk3588 fragment).
#
# Mainline U-Boot + Linux. The board DTS is NOT upstream yet, so hooks.sh injects
# rk3588-hinlink-h88k.dts (ported from Armbian's rockchip64-6.18) into the kernel
# tree. U-Boot reuses Rock 5B (same approach as Armbian): close enough to init DDR
# and load the kernel; DDR itself lives in the shared Rockchip TPL blob.
BOARD_VENDOR="rockchip"
BOARD_SOC="rk3588"
BOARD_UBOOT_DEFCONFIG="rock5b-rk3588_defconfig"
BOARD_KERNEL_DTB="rockchip/rk3588-hinlink-h88k.dtb"
BOARD_HOSTNAME="hinlink-h88k"
BOARD_MENU_TITLE="Hinlink H88K"
BOARD_SERIAL_CONSOLE="ttyS2"
BOARD_SERIAL_BAUD="1500000"

# Three wired NICs, all DHCP, no role distinction. On Arch ALARM's shipped
# systemd-networkd en/eth catch-all already covers them; on Alpine the engine
# writes one DHCP stanza per NIC (see lib/distro/alpine.sh).
BOARD_NICS="3"

# Keep the full linux-firmware pool on every distro (don't strip on Arch; install
# it on Alpine). The 240x135 LCD's init-sequence blob ships separately (vendored).
FULL_FIRMWARE="${FULL_FIRMWARE:-1}"

# No OpenZFS: this board rides the mainline kernel tip like every other board
# (no KERNEL_REF pin). ZFS stays available as an opt-in cross-board feature — set
# WITH_ZFS=1 (and pin KERNEL_REF to a ZFS-supported release, e.g. v7.0) to enable
# it; off by default here.

# Variant: 240x135 SPI LCD "screen" (default) vs "noscreen". Unlike the M28K OLED
# (i2c, userspace-only) this panel is in the device tree, so the flavours differ
# in BOTH the injected DTS (panel node) and the kernel (panel-mipi-dbi fragment).
H88K_LCD="${H88K_LCD:-1}"
if [[ "${H88K_LCD}" == "1" ]]; then
  BOARD_IMAGE_PREFIX="hinlink-h88k"
  BOARD_KERNEL_FRAGMENTS="h88k-lcd"
else
  BOARD_IMAGE_PREFIX="hinlink-h88k-noscreen"
fi
