# Widora MangoPi M28K (RK3528). Board DTS/defconfig + RK3528 USB backport injected
# (see hooks.sh); onboard AIC8800 Wi-Fi/BT over SDIO; optional 0.91" SSD1306 OLED
# ECG dashboard. Dual-gigabit. Kernel + dtb are identical for screen/noscreen.
BOARD_VENDOR="rockchip"
BOARD_SOC="rk3528"
BOARD_UBOOT_DEFCONFIG="mangopi-m28k-rk3528_defconfig"
BOARD_KERNEL_DTB="rockchip/rk3528-mangopi-m28k.dtb"
BOARD_HOSTNAME="mangopi-m28k"
BOARD_MENU_TITLE="Widora MangoPi M28K"
BOARD_SERIAL_CONSOLE="ttyS0"
BOARD_SECOND_NIC="1"
BOARD_KERNEL_FRAGMENTS="kernel"   # boards/m28k/kernel.fragment (SSD130X OLED + wifi/bt core)

# Variant: OLED "screen" (default) vs "noscreen". Kernel + dtb are identical; only
# the OLED userspace (board_install_extras) and the image name differ.
M28K_OLED="${M28K_OLED:-1}"
if [[ "${M28K_OLED}" == "1" ]]; then
  BOARD_IMAGE_PREFIX="widora-mangopi-m28k-screen"
else
  BOARD_IMAGE_PREFIX="widora-mangopi-m28k-noscreen"
fi
