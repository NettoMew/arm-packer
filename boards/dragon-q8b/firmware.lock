file linux-firmware intel/iwlwifi/iwlwifi-ty-a0-gf-a0-89.ucode 792478ef7752595525379a5068e2d47e310a2c344636b7df866c54746ced1dc0
file linux-firmware intel/iwlwifi/iwlwifi-ty-a0-gf-a0.pnvm 9697e327f8171454b3c19b1ec9449753d5b934d4e91722f469616818a6d477b0
link iwlwifi-ty-a0-gf-a0-89.ucode intel/iwlwifi/iwlwifi-ty-a0-gf-a0-89.ucode
link iwlwifi-ty-a0-gf-a0.pnvm intel/iwlwifi/iwlwifi-ty-a0-gf-a0.pnvm
file linux-firmware intel/ibt-0041-0041.sfi 2d891022ded1d2d8b208cc5b7632f3098c761ae099024de971e4158dd5681a9c
