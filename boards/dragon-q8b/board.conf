# Radxa Dragon Q8B (Qualcomm SC8280XP / Snapdragon 8cx Gen 3). The boot chain is
# the board's own UEFI in SPI NOR: the image is a GPT disk with an ESP, booted
# by systemd-boot with the board DTB named in the loader entry (lib/vendor/qcom.sh).
# Boots from USB, microSD or NVMe.
# The BIOS "Third-party OS Compatibility" switches must stay at their defaults:
# they rewrite the firmware's own DT, which this image does not use. So must
# "Hypervisor Override" (Auto): the EL2 entry relies on it.
BOARD_VENDOR="qcom"
BOARD_SOC="sc8280xp"
BOARD_KERNEL_DTB="qcom/sc8280xp-radxa-dragon-q8b.dtb"
BOARD_KERNEL_FRAGMENTS="kernel"
BOARD_IMAGE_PREFIX="radxa-dragon-q8b"
BOARD_HOSTNAME="radxa-dragon-q8b"
BOARD_MENU_TITLE="Radxa Dragon Q8B"
# uart17 on the 40-pin header (pin 8 TXD, pin 10 RXD), aliased serial0.
BOARD_SERIAL_CONSOLE="ttyMSM0"
BOARD_SERIAL_BAUD="115200"
# The same four arguments Radxa OS and Armbian boot this SoC with: keep clocks and
# power domains the firmware left on, and avoid pointer authentication and EFI
# runtime services, which the platform firmware does not support reliably.
BOARD_KERNEL_CMDLINE_EXTRA="clk_ignore_unused pd_ignore_unused arm64.nopauth efi=noruntime"
# Two 2.5 GbE ports (eth0, eth1), both DHCP.
BOARD_NICS=2
# A second loader entry boots the same kernel at EL2, with KVM: its DTB asks the
# firmware for EL2 (/chosen/radxa,enable-kvm) and marks the DSPs for qebspil.
# The EL1 entry stays the default.
BOARD_BOOT_VARIANTS="el2=qcom/sc8280xp-radxa-dragon-q8b-el2.dtb"
