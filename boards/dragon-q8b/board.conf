# Radxa Dragon Q8B (Qualcomm SC8280XP / Snapdragon 8cx Gen 3). The boot chain is
# the board's own UEFI in SPI NOR: the image is a GPT disk with an ESP, booted
# by systemd-boot with the board DTB named in the loader entry (lib/vendor/qcom.sh).
# Boots from USB, microSD or NVMe.
#
# The OS runs at EL2, with KVM. The DTB asks the firmware for it
# (/chosen/radxa,enable-kvm), which works while the BIOS "Hypervisor Override"
# option stays at its default, Auto. The DSPs (and with the ADSP the fan, USB-C
# and audio) need BIOS 260916 or later: at EL2 it starts them before the kernel
# attaches ("Remoteproc firmware preload", default Auto). The BIOS
# "Third-party OS Compatibility" switches must stay at their defaults as well:
# they rewrite the firmware's own DT, which this image does not use.
BOARD_VENDOR="qcom"
BOARD_SOC="sc8280xp"
BOARD_KERNEL_DTB="qcom/sc8280xp-radxa-dragon-q8b-el2.dtb"
BOARD_KERNEL_FRAGMENTS="kernel"
BOARD_IMAGE_PREFIX="radxa-dragon-q8b"
BOARD_HOSTNAME="radxa-dragon-q8b"
BOARD_MENU_TITLE="Radxa Dragon Q8B"
# uart17 on the 40-pin header (pin 8 TXD, pin 10 RXD), aliased serial0.
BOARD_SERIAL_CONSOLE="ttyMSM0"
BOARD_SERIAL_BAUD="115200"
# Keep the clocks the firmware left on (it adds clk_ignore_unused itself when
# the command line lacks it), and leave the EFI runtime services, which the
# platform firmware does not support reliably, alone. Unused power domains may
# be switched off: the GDSCs the SoC relies on stay up until their providers'
# sync_state(). Pointer authentication works at EL2, so arm64.nopauth, needed
# under the EL1 hypervisor, is gone.
BOARD_KERNEL_CMDLINE_EXTRA="clk_ignore_unused efi=noruntime"
# Two 2.5 GbE ports (eth0, eth1), both DHCP.
BOARD_NICS=2
# The root is a ZFS pool (lib/fs/zfs.sh): the kernel boots from the ESP, and
# containers and VMs get snapshots, clones and compression. Only DISTRO=debian
# can boot it; ROOTFS_TYPE=ext4 builds the others.
BOARD_ROOTFS_TYPE="zfs"
