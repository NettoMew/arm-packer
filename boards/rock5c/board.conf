# Radxa ROCK 5C (RK3588S2 / RK3582). Fully mainline U-Boot + Linux. The board
# ships with either a full RK3588S2 or a binned RK3582; RK3582 core-unlock (开核)
# is applied via a U-Boot patch in hooks.sh (ROCK5C_UNLOCK, default on; no-op on a
# genuine RK3588S2). AIC8800D80 Wi-Fi over USB. Mali-G610 → Panthor (rk3588 frag).
BOARD_VENDOR="rockchip"
BOARD_SOC="rk3588"
BOARD_UBOOT_DEFCONFIG="rock-5c-rk3588s_defconfig"
BOARD_KERNEL_DTB="rockchip/rk3588s-rock-5c.dtb"
BOARD_IMAGE_PREFIX="radxa-rock5c"
BOARD_HOSTNAME="radxa-rock5c"
BOARD_MENU_TITLE="Radxa ROCK 5C"
BOARD_SERIAL_CONSOLE="ttyS2"
# The M.2/FPC NVMe drops off the bus a couple minutes in (NVMe APST + PCIe ASPM
# over the FPC link); the kernel itself recommends disabling both.
BOARD_KERNEL_CMDLINE_EXTRA="nvme_core.default_ps_max_latency_us=0 pcie_aspm=off"
