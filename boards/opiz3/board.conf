# Xunlong Orange Pi Zero 3 (Allwinner H618) — fully from source, no closed blobs.
# BL31 from upstream arm-trusted-firmware (PLAT=sun50i_h616); H616/H618 DRAM init
# in the open-source U-Boot SPL → u-boot-sunxi-with-spl.bin at 8 KiB, MBR disk.
# orangepi_zero3_defconfig + sun50i-h618 dtb are already in mainline, so no board
# source injection. Targets the 1GB RAM variant. Single NIC, no Wi-Fi, no OLED.
BOARD_VENDOR="allwinner"
BOARD_SOC="h618"
BOARD_UBOOT_DEFCONFIG="orangepi_zero3_defconfig"
BOARD_KERNEL_DTB="allwinner/sun50i-h618-orangepi-zero3.dtb"
BOARD_IMAGE_PREFIX="orangepi-zero3"
BOARD_HOSTNAME="orangepi-zero3"
BOARD_MENU_TITLE="Orange Pi Zero 3"
BOARD_SERIAL_CONSOLE="ttyS0"
BOARD_SERIAL_BAUD="115200"
