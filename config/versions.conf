# Shared source defaults. Environment/board overrides take precedence.
# Only this file defines the default kernel release; do not duplicate it in tests.
# Change the kernel via scripts/kernel-update.sh promote after validation/testing.
DEFAULT_KERNEL_REPO='https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
DEFAULT_KERNEL_REF='v7.2.7'

# Shared boot-chain defaults (U-Boot/ATF still follow their upstream branches).
# Board-specific exceptions remain in boards/<board>/board.conf.
DEFAULT_UBOOT_REPO='https://source.denx.de/u-boot/u-boot.git'
DEFAULT_UBOOT_REF='master'
DEFAULT_RKBIN_REPO='https://github.com/rockchip-linux/rkbin.git'
# Keep the firmware tree paired with the versioned blob names in vendor/rockchip.sh.
# Upstream master removes old blobs; this commit contains both RK3528 and RK3588 pairs.
DEFAULT_RKBIN_REF='31a78b07f8a2f51a02655efcdda0f3ad30d172b9'
DEFAULT_ATF_REPO='https://github.com/ARM-software/arm-trusted-firmware.git'
DEFAULT_ATF_REF='master'
DEFAULT_AIC8800_REPO='https://github.com/radxa-pkg/aic8800.git'
DEFAULT_AIC8800_COMMIT='89f865b80f5f2ba6c0711c560e1d0191e87a1bf0'

# systemd-boot for UEFI boards (lib/boot/uefi.sh): Debian's systemd-boot-efi arm64
# package, of which only systemd-bootaa64.efi is used. The pool drops superseded
# versions; the snapshot archive keeps this exact file, so both URLs stay valid.
SYSTEMD_BOOT_VERSION='257.13-1~deb13u1'
SYSTEMD_BOOT_SHA256='0e4529d9a72b35c31f34151ef8a0df20f322cfef679f4f5439394e60505b91a2'
SYSTEMD_BOOT_URLS='https://deb.debian.org/debian/pool/main/s/systemd/systemd-boot-efi_257.13-1~deb13u1_arm64.deb https://snapshot.debian.org/archive/debian/20260924T000000Z/pool/main/s/systemd/systemd-boot-efi_257.13-1~deb13u1_arm64.deb'

# qebspil (lib/qebspil.sh): UEFI driver that starts Qualcomm DSPs before an EL2
# boot. Its submodules (gnu-efi, dtc) are pinned by this commit.
DEFAULT_QEBSPIL_REPO='https://github.com/stephan-gh/qebspil.git'
DEFAULT_QEBSPIL_COMMIT='8e4d9e676a3b3afe136cda9b953a2139ff1a32d0'

# OpenZFS (lib/fs/zfs.sh): the kernel modules of a ZFS root, built with the
# image's kernel from the release tarball. The distro supplies the userspace of
# the same release (Debian trixie contrib: zfsutils-linux 2.3.9), so the two move
# together. META's Linux-Maximum bounds the kernels it builds against.
OPENZFS_VERSION='2.3.9'
OPENZFS_SHA256='26b0c7d433ebc3cbea5289b9d06792d628aff13c2c6e5ce70096db1b026c5699'
OPENZFS_URL='https://github.com/openzfs/zfs/releases/download/zfs-2.3.9/zfs-2.3.9.tar.gz'

# Upstream updater and its required environment library. The minimal updater
# disables persistent bootloader access; libubootenv is still a link dependency.
SWUPDATE_VERSION='2026.05.1'
SWUPDATE_COMMIT='9000ecb52677da7d9676a61b729bab57dba99674'
SWUPDATE_SHA512='64465876f8044e9a67d294bce762ad69cecfde4430147c9009442ca2f42595f81bebe5cbec3a65aba46da3c43cd8fce3fcfd0578b37a55107f9198fc344c7964'
LIBUBOOTENV_VERSION='0.3.7'
LIBUBOOTENV_COMMIT='1e3511ed77f794ee5decc0974d54c8e5af26f64c'
LIBUBOOTENV_SHA512='a089fc7ec07db31b0bdc96958ce5dd9ec8a1eab661f523d2ef95315e40e6c216b6041a783a0012738191575c6442dd04fb56a634d5eb8066b0b54aa60ea96894'
